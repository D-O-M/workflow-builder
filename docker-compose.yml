services:
  angular-app:
    build:
      context: .
      dockerfile: UI/Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ng serve --host 0.0.0.0
    develop:
      watch:
        - path: .
          target: /app
          action: sync

<mat-sidenav-container
  class="app-shell"
  data-testid="app-shell"
  [style.--app-shell-nav-width]="navDrawerWidth()"
  [style.--app-shell-content-offset]="contentOffset()"
>
  <mat-sidenav
    id="app-primary-navigation"
    class="app-shell__nav"
    [class.is-collapsed]="sidebarCollapsed() && !compactViewport()"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    [fixedInViewport]="compactViewport()"
    aria-label="Primary navigation"
    data-testid="app-shell-nav"
  >
    <div class="app-shell__nav-header">
      <div class="app-shell__brand-mark">
        <mat-icon>account_tree</mat-icon>
      </div>

      @if (!sidebarCollapsed() || compactViewport()) {
        <div class="app-shell__brand-copy">
          <strong>WorkflowBuilder</strong>
          <span>Blueprint orchestration</span>
        </div>
      }
    </div>

    <mat-divider />

    <mat-nav-list>
      @for (item of navItems; track item.id) {
        <a
          mat-list-item
          class="app-shell__nav-link"
          [attr.data-testid]="'app-shell-nav-' + item.id"
          [class.is-active]="activeNavId() === item.id"
          [routerLink]="[item.route]"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [attr.aria-current]="activeNavId() === item.id ? 'page' : null"
          (click)="closeNavigationDrawer()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-shell__content">
    <mat-toolbar class="app-shell__toolbar" data-testid="app-shell-toolbar">
      <button
        mat-icon-button
        type="button"
        (click)="toggleNavigationDrawer()"
        [attr.aria-expanded]="sidenavOpened()"
        aria-controls="app-primary-navigation"
        aria-label="Toggle navigation"
        data-testid="app-shell-nav-toggle"
      >
        <mat-icon>{{ compactViewport() && mobileSidebarOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>

      <div class="app-shell__toolbar-copy">
        <h1 data-testid="app-shell-title">{{ shellState().title }}</h1>
      </div>

      <span class="app-shell__toolbar-spacer"></span>

      <button mat-icon-button type="button" aria-label="Search" data-testid="app-shell-search">
        <mat-icon>search</mat-icon>
      </button>
      <button mat-icon-button type="button" aria-label="Notifications" matTooltip="Notifications" data-testid="app-shell-notifications">
        <mat-icon>notifications_none</mat-icon>
      </button>
      <button mat-icon-button type="button" aria-label="Help" matTooltip="Help" data-testid="app-shell-help">
        <mat-icon>help_outline</mat-icon>
      </button>
      <button
        mat-stroked-button
        type="button"
        class="app-shell__profile-button"
        aria-label="Profile"
        data-testid="app-shell-profile"
      >
        {{ profileInitial() }}
      </button>
    </mat-toolbar>

    <section class="app-shell__content-body" data-testid="app-shell-content">
      <router-outlet />
    </section>
  </mat-sidenav-content>
</mat-sidenav-container>

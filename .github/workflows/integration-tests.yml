name: Integration Tests

on:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Deterministic Integration Plugin Bundles
        shell: pwsh
        run: ./IntegrationTests/scripts/build-integration-plugin-bundles.ps1 -OutputDir "$env:RUNNER_TEMP/integration-plugin-bundles"

      - name: Run Integration Tests
        shell: pwsh
        run: ./IntegrationTests/scripts/run-integration-tests.ps1

      - name: Upload Integration Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            TestResults
            **/*.trx
            IntegrationTests/WorkflowBuilder.IntegrationTests/LiveRuns

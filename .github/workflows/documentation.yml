name: Documentation
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BuildScripts/docs-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BuildScripts/docs-check/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
